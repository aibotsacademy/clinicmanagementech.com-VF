<style>
:root{
  /* Clinic Management Tech palette */
  --porcelain:#F8F3EC; --white:#FFFFFF; --ink:#211A18; --warm-gray:#665954;
  --burgundy:#713C47; --wine:#3F2127; --terracotta:#934633; --terracotta-deco:#C36A55;
  --bronze:#80512E; --champagne:#F0D28B; --teal:#2E645E; --rose:#F6E0D3;
  --line-light:#DFD2C4; --line-dark:#8E6068;
  /* roles (older names kept so every rule maps to the palette) */
  --cream:var(--porcelain); --cream-2:var(--rose); --paper:var(--white);
  --gold:var(--terracotta); --gold-2:var(--champagne); --gold-3:var(--bronze); --gold-soft:rgba(147,70,51,.10);
  --ink-2:var(--warm-gray); --muted:var(--warm-gray);
  --dark:var(--burgundy); --dark-2:var(--wine); --dark-line:var(--line-dark);
  --line:var(--line-light); --ok:var(--teal);
  --grad-gold:linear-gradient(135deg,#7E4553 0%,#713C47 55%,#62323D 100%);
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 30px 70px -30px rgba(63,33,39,.35);
  --head:"Belleza",Manrope,sans-serif; --serif:"EB Garamond",Georgia,serif; --ui:Manrope,system-ui,sans-serif;
  --mono:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--ui);margin:0;letter-spacing:-.01em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* brand + buttons */
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand .logo{width:30px;height:42px}
.sep{width:1px;height:34px;background:var(--gold);opacity:.6}
.wordmark{font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.32em;line-height:1.35;text-transform:uppercase}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:16px 28px;border-radius:999px;transition:transform .25s var(--ease),box-shadow .25s,background .25s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn-gold{background:var(--grad-gold);color:#fff;box-shadow:0 14px 30px -12px rgba(128,81,46,.65)}
.btn-gold:hover:not(:disabled){box-shadow:0 18px 40px -12px rgba(128,81,46,.8);transform:translateY(-1px)}
.btn-line{border:1.5px solid var(--gold);color:var(--gold-3);background:transparent}
.btn-line:hover{background:var(--gold-soft)}
.btn-light{background:var(--cream);color:var(--ink)}
.btn-light:hover{background:#fff}
.btn svg{width:16px;height:16px}

/* nav */
.pagebar{position:fixed;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--grad-gold);z-index:60;pointer-events:none}
.nav{position:sticky;top:0;z-index:40;background:rgba(248,243,236,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}
.nav-links{display:flex;gap:24px;font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.nav-links a{text-decoration:none;color:var(--ink-2);position:relative;white-space:nowrap}
.nav-links a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1.5px;background:var(--gold);transition:right .3s var(--ease)}
.nav-links a:hover::after{right:0}
.nav .btn{padding:12px 20px;font-size:11.5px}
.burger{display:none;background:none;border:0;width:42px;height:42px;cursor:pointer;color:var(--ink)}
@media (max-width:1140px){
  .nav-links{position:fixed;inset:76px 0 auto 0;flex-direction:column;gap:0;background:var(--cream);border-bottom:1px solid var(--line);padding:8px 20px 18px;transform:translateY(-130%);transition:transform .35s var(--ease);z-index:-1}
  .nav-links a{padding:14px 0;border-bottom:1px solid var(--line)}
  .nav-links.open{transform:none}
  .burger{display:grid;place-items:center}
  .nav .btn{display:none}
}

/* section primitives */
section{position:relative}
.pad{padding:110px 0}
@media (max-width:700px){.pad{padding:76px 0}}
.center{text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-3)}
.eyebrow::before,.eyebrow.both::after{content:"";width:34px;height:1px;background:var(--gold)}
.h-sec{font-weight:900;text-transform:uppercase;font-size:clamp(28px,4.4vw,48px);line-height:1.04;letter-spacing:-.015em;margin:18px 0 16px;text-wrap:balance}
.h-sec em,.g{font-style:normal;color:var(--gold)}
.lead{font-size:clamp(16px,1.6vw,18px);color:var(--ink-2);max-width:62ch}
.center .lead{margin-left:auto;margin-right:auto}
.fine{font-size:12px;color:var(--muted);font-style:italic;margin:14px 0 0}
.dark{background:var(--dark);color:var(--cream);overflow:hidden}
.dark .h-sec{color:var(--cream)}
.dark .lead{color:rgba(248,243,236,.84)}
.dark .eyebrow{color:var(--gold-2)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

.faq{max-width:820px;margin:50px auto 0;display:grid;gap:12px}
.faq details{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:20px 24px;font-family:var(--ui);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;font-weight:400;color:var(--gold);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 24px 22px;color:var(--ink-2);font-size:15px}

/* ============ CTA / FORM ============ */
.cta{padding:20px 0 110px}
.cta-box{background:var(--dark);border-radius:34px;padding:60px;display:grid;grid-template-columns:.9fr 1.1fr;gap:50px;align-items:center;color:var(--cream)}
.cta-box .h-sec{color:var(--cream)}
.df-f input:focus,.df-f select:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
footer{border-top:1px solid var(--line);padding:44px 0 50px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer nav{display:flex;gap:22px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--gold-3)}
footer .wordmark{font-size:10px;color:var(--ink)}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper);margin-left:auto}
.lang button{appearance:none;border:0;background:none;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--cream)}
@media (min-width:1141px){.lang{margin-left:0}}
/* palette + type: Belleza titles · EB Garamond editorial · Manrope UI */
h1,h2,h3,h4,.h-sec{font-family:var(--head);font-weight:400;font-synthesis:none;letter-spacing:0}
.h-sec{text-transform:none;line-height:1.05;font-size:clamp(30px,4.6vw,54px)}
.h-sec em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--terracotta)}
.lead,.faq details p{font-family:var(--serif);font-size:clamp(18px,1.7vw,21px);line-height:1.5}
.eyebrow{color:var(--bronze);font-weight:700}
.eyebrow::before,.eyebrow.both::after{background:var(--terracotta-deco)}
.btn-gold{background:var(--burgundy);box-shadow:0 14px 30px -14px rgba(113,60,71,.7)}
.btn-gold:hover:not(:disabled){background:#62323D;box-shadow:0 18px 40px -14px rgba(113,60,71,.8)}
.btn-line{border-color:var(--burgundy);color:var(--burgundy)}
.btn-line:hover{background:rgba(113,60,71,.06)}
.btn-light{background:var(--porcelain);color:var(--burgundy)}
.pagebar{background:var(--teal)}
.lang button.on{background:var(--burgundy);color:#fff}
.nav{background:rgba(248,243,236,.9)}
.nav-links a{color:var(--ink)}
.nav-links a::after{background:var(--terracotta)}
.dark,.cta-box{background:var(--burgundy);color:var(--porcelain)}
.dark .h-sec em,.cta-box .h-sec em{color:var(--champagne)}
.dark .eyebrow,.cta-box .eyebrow{color:var(--champagne)}
.dark .eyebrow::before,.cta-box .eyebrow::before{background:var(--champagne)}
.dark .lead,.cta-box .lead{color:rgba(248,243,236,.88)}
.cta-box .btn-gold{background:var(--porcelain);color:var(--burgundy)}
footer{background:var(--wine);color:rgba(248,243,236,.82);border-top:0}
footer .wordmark{color:var(--porcelain)}
footer a:hover{color:var(--champagne)}
footer .sep{background:var(--champagne)}
/* "Diagnosticar mi clínica": solid, calm, no animation */
.btn-diag{flex:none;background:var(--terracotta);color:#fff;padding:13px 22px;font-size:11.5px;letter-spacing:.12em;box-shadow:none}
.btn-diag:hover{background:#7E3B2B}
@media (max-width:1140px){.nav .btn-diag{display:inline-flex}}
.lang-m{display:none}
@media (min-width:1141px) and (max-width:1340px){.nav-links{gap:16px;font-size:11px}.nav .wrap{gap:12px}}
@media (max-width:640px){
  .nav .btn-diag{padding:10px 13px;font-size:10px;letter-spacing:.08em;margin-left:auto}
  .nav .wordmark,.nav .brand .sep{display:none}
  .nav .wrap > .lang{display:none}
  .lang-m{display:flex;align-self:flex-start;margin:14px 0 4px}
}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
/* GEO page */
.geo-page main{overflow-x:clip}
.g-head{max-width:760px;margin-bottom:44px}
.g-head.center{margin-left:auto;margin-right:auto;text-align:center}
.g-head .lead{margin-top:6px}
.g-rose{background:linear-gradient(180deg,var(--rose),var(--porcelain))}
.g-dark{background:var(--burgundy)}
.g-dark .g-head .lead,.g-dark p{color:rgba(248,243,236,.88)}
.sub-h{font-family:var(--head);font-weight:400;font-size:24px;margin:56px 0 18px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line-light)}
.seg button{appearance:none;border:0;background:none;font:inherit;font-family:var(--ui);font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;color:var(--warm-gray);cursor:pointer}
.seg button.on{background:var(--burgundy);color:#fff}
.center-seg{display:flex;width:max-content;max-width:100%;margin:0 auto 40px;flex-wrap:wrap;justify-content:center}

/* hero: sticky, scroll-driven */
.hx{position:relative;height:calc(var(--n,6) * 55vh + 100vh);--p:0}
.hx-stage{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;justify-content:center;padding:84px 0 46px;overflow:hidden}
.hx-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hx-bg i{position:absolute;border-radius:50%;filter:blur(10px)}
.hx-bg i:first-child{width:62vmax;height:62vmax;right:-18vmax;top:-22vmax;background:radial-gradient(circle,rgba(246,224,211,.95),transparent 65%);transform:translate3d(calc(var(--p) * -12vmax),calc(var(--p) * 10vmax),0)}
.hx-bg i:last-child{width:44vmax;height:44vmax;left:-16vmax;bottom:-24vmax;background:radial-gradient(circle,rgba(113,60,71,.10),transparent 65%);transform:translate3d(calc(var(--p) * 10vmax),calc(var(--p) * -8vmax),0)}
.hx-grid{display:grid;grid-template-columns:1fr 1.02fr;gap:56px;align-items:center;width:100%}
.hx-copy h1{font-family:var(--head);font-weight:400;font-size:clamp(34px,4.2vw,56px);line-height:1.04;margin:16px 0 14px;letter-spacing:0}
.hx-lead{font-family:var(--serif);font-size:clamp(17px,1.6vw,20px);line-height:1.45;color:var(--warm-gray);margin:0 0 18px;max-width:46ch}
.hx-copy h1 em{display:block;font-family:var(--serif);font-style:italic;color:var(--terracotta)}
.hx-nums{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-bottom:18px}
.hx-nums div{border:1px solid var(--line-light);background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:18px;padding:12px 14px}
.hx-nums b{display:block;font-family:var(--head);font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hx-nums span{display:block;font-size:12px;line-height:1.3;color:var(--warm-gray);margin-top:6px}
.hx-nums .hx-zero{background:var(--burgundy);border-color:var(--burgundy)}
.hx-nums .hx-zero b{color:var(--champagne);font-size:clamp(38px,4.4vw,58px)}
.hx-nums .hx-zero span{color:rgba(248,243,236,.9)}
.hx-rail{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 6px;flex-wrap:wrap}
.hx-rail button{appearance:none;border:0;background:none;cursor:pointer;padding:4px 0;display:grid;gap:6px;font:inherit;text-align:left;color:var(--warm-gray)}
.hx-rail i{display:block;width:58px;height:3px;border-radius:3px;background:var(--line-light);position:relative;overflow:hidden}
.hx-rail i::after{content:"";position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.hx-rail .done i::after,.hx-rail .on i::after{transform:none}
.hx-rail span{font-size:10.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.hx-rail .on span{color:var(--burgundy)}
.hx-chat{background:#fff;border:1px solid var(--line-light);border-radius:26px;box-shadow:0 40px 90px -40px rgba(63,33,39,.45);overflow:hidden;transform:perspective(1200px) rotateX(calc((.5 - var(--p)) * 4deg)) translateY(calc(var(--p) * -14px));transition:box-shadow .5s}
.hx-chat.mine{box-shadow:0 40px 90px -36px rgba(113,60,71,.7),0 0 0 2px var(--burgundy)}
.hx-top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-light);background:var(--porcelain)}
.hx-av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--terracotta);color:#fff;font-weight:800;font-size:13px}
.hx-top b{display:block;font-size:14px;line-height:1.1}
.hx-top small{font-size:11.5px;color:var(--warm-gray)}
.hx-step{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--bronze);font-variant-numeric:tabular-nums}
.hx-body{padding:16px 18px 18px;min-height:420px;display:flex;flex-direction:column}
.hx-q{align-self:flex-end;max-width:90%;background:var(--rose);color:var(--ink);padding:11px 15px;border-radius:18px 18px 4px 18px;font-size:15px;min-height:44px}
.hx-caret{display:inline-block;width:2px;height:1em;background:var(--burgundy);margin-left:2px;vertical-align:-2px;animation:hx-blink 1s steps(2) infinite}
@keyframes hx-blink{50%{opacity:0}}
.hx-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warm-gray);margin:14px 0 8px;min-height:18px}
.hx-meta svg{width:15px;height:15px;color:var(--teal)}
.hx-list{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.hx-list li{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center;padding:9px 12px;border-radius:13px;border:1px solid var(--line-light);animation:hx-row .5s var(--ease) both;animation-delay:calc(var(--k) * 70ms)}
@keyframes hx-row{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.hx-list .d{font-size:11.5px;font-weight:700;color:var(--teal)}
.hx-list .tt{grid-column:1;font-size:13.5px;line-height:1.3}
.hx-list .ty{grid-row:1/3;grid-column:2;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--rose);color:var(--bronze);white-space:nowrap}
.hx-list .ty.abroad,.hx-list .ty.article,.hx-list .ty.school{background:#F1E9E1;color:var(--warm-gray)}
.hx-list .ty.other{background:var(--burgundy);color:#fff}
.hx-foot{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;min-height:46px}
.hx-foot .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:999px;animation:hx-row .5s var(--ease) both;animation-delay:.4s}
.hx-foot .fr{background:#F1E9E1;color:var(--ink)}
.hx-foot .you{background:var(--burgundy);color:#fff}
.hx-foot svg{width:16px;height:16px;flex:none}
.hx-foot > svg{width:22px;height:22px;color:var(--burgundy)}
.hx-foot > span{flex:1;min-width:0;animation:hx-row .5s var(--ease) both;animation-delay:.4s}
.hx-foot b{color:var(--burgundy)}
.mine .hx-foot{border-top:1px dashed var(--burgundy)}
.hx-note .sm{display:none}
@media (max-width:640px){.hx-note .sm{display:inline}}
.hx-note{max-width:1180px;margin:14px auto 0;padding:0 20px;font-size:11.5px;color:var(--warm-gray);width:100%}
.hx-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);opacity:calc(1 - var(--p) * 6)}
.hx-hint i{width:1px;height:26px;background:linear-gradient(var(--bronze),transparent);animation:hx-drop 1.8s var(--ease) infinite}
@keyframes hx-drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* load-in */
.hx-in,.hx-chat{opacity:0;translate:0 22px;filter:blur(6px);transition:opacity .9s var(--ease),translate .9s var(--ease),filter .9s var(--ease),box-shadow .5s}
.hx-ready .hx-in,.hx-ready .hx-chat{opacity:1;translate:none;filter:none}
.hx-ready .hx-copy .hx-in:nth-child(2){transition-delay:.08s}.hx-ready .hx-copy .hx-in:nth-child(3){transition-delay:.16s}.hx-ready .hx-copy .hx-in:nth-child(4){transition-delay:.24s}.hx-ready .hx-copy .hx-in:nth-child(5){transition-delay:.32s}.hx-ready .hx-copy .hx-in:nth-child(6){transition-delay:.4s}.hx-ready .hx-chat{transition-delay:.2s}

/* scroll motion: reversible reveals, word titles, parallax, nav */
.rv{filter:blur(6px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.rv.in{filter:none}
.h-sec.rv{opacity:1;transform:none;filter:none}
.h-sec .w{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(4px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease);transition-delay:calc(var(--i) * 45ms)}
.h-sec.in .w{opacity:1;transform:none;filter:none}
.g-head,.chart-box,.bubble,.qz-side,.m1-curve{translate:0 var(--py,0)}
.nav{transition:transform .45s var(--ease),border-color .3s}
.nav.hide{transform:translateY(-100%)}
@media (prefers-reduced-motion:reduce){
  .hx-in,.hx-chat,.h-sec .w,.rv{opacity:1!important;translate:none!important;transform:none!important;filter:none!important;transition:none!important}
  .hx-list li,.hx-foot .pill,.hx-foot > span,.hx-caret,.hx-hint i{animation:none}
}

/* why */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.why-c{background:#fff;border:1px solid var(--line-light);border-radius:var(--r);padding:26px}
.why-c .ic,.cp .ic{width:44px;height:44px;border-radius:13px;background:var(--rose);color:var(--burgundy);display:grid;place-items:center;margin-bottom:14px}
.why-c .ic svg,.cp .ic svg{width:22px;height:22px}
.why-c h3{font-size:22px;margin:0 0 8px}
.why-c p{margin:0;color:var(--warm-gray);font-size:15px}
.why-c .src{margin-top:12px;font-size:12.5px}
.why-c .src a{color:var(--terracotta);font-weight:600}

/* how */
.pillars4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pil{border:1px solid var(--line-dark);border-radius:var(--r);padding:24px;background:rgba(255,255,255,.04)}
.pil .n{font-family:var(--head);font-size:40px;color:var(--champagne);line-height:1}
.pil h3{font-size:24px;color:#F8F3EC;margin:12px 0 8px}
.pil p{margin:0;font-size:14.5px}
.process{list-style:none;padding:0;margin:44px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.process::before{content:"";position:absolute;left:10%;right:10%;top:22px;border-top:1px dashed rgba(240,210,139,.5)}
.process li{text-align:center;padding:0 10px;position:relative}
.process span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--champagne);color:var(--wine);font-weight:800}
.process b{display:block;font-family:var(--head);font-weight:400;font-size:20px;color:#F8F3EC}
.process p{margin:6px 0 0;font-size:13.5px}

/* opportunities */
.opp{background:#fff;border:1px solid var(--line-light);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.opp-ctrl{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{appearance:none;border:1px solid var(--line-light);background:var(--porcelain);font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;color:var(--ink)}
.pills button.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.op-h,.op-r{display:grid;grid-template-columns:1fr 130px 90px;gap:12px;align-items:center;padding:12px 8px}
.op-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze);border-bottom:1px solid var(--line-light)}
.op-r + .op-r{border-top:1px solid var(--line-light)}
.op-r .q{font-family:var(--serif);font-size:18px}
.op-r .c{font-size:13px;color:var(--warm-gray)}
.op-r .i{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;justify-self:start}
.op-r .i.alta{background:rgba(46,100,94,.12);color:var(--teal)}
.op-r .i.media{background:var(--rose);color:var(--bronze)}
.opp-types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ot{background:#fff;border:1px solid var(--line-light);border-radius:18px;padding:18px}
.ot-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ot-h b{font-family:var(--head);font-weight:400;font-size:19px}
.ot-h span{font-weight:800;color:var(--teal)}
.ot i{display:block;height:6px;border-radius:6px;background:var(--line-light);margin:10px 0;overflow:hidden;position:relative}
.ot i::after{content:"";position:absolute;inset:0;width:0;background:var(--teal);border-radius:6px;transition:width 1.2s var(--ease)}
.ot.go i::after{width:var(--v)}
.ot p{margin:0;font-size:14px;color:var(--warm-gray)}

/* month 1 */
.g-m1{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.m1-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dg{background:#fff;border:1px solid var(--line-light);border-radius:18px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.dg .ic{width:44px;height:44px;border-radius:13px;background:var(--rose);color:var(--burgundy);display:grid;place-items:center}
.dg .ic svg{width:22px;height:22px}
.dg .wk{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.dg b{font-family:var(--head);font-weight:400;font-size:18px}
.dg p{margin:4px 0 0;font-size:13.5px;color:var(--warm-gray)}
.m1-curve{margin-top:22px;padding:16px 18px;border-radius:16px;background:#fff;border:1px solid var(--line-light);display:grid;gap:10px}
.m1-curve b{font-family:var(--head);font-weight:400;font-size:20px}
.m1-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m1-steps div{border-radius:12px;padding:10px;background:var(--porcelain);font-size:13px;color:var(--ink)}
.m1-steps span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.m1-steps i{display:block;height:5px;border-radius:5px;background:var(--line-light);margin-top:8px;overflow:hidden}
.m1-steps i::after{content:"";display:block;height:100%;width:var(--w);background:var(--teal);border-radius:5px}

/* reviews */
.rev{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;counter-reset:rv}
.rev-s{background:#fff;border:1px solid var(--line-light);border-radius:18px;padding:18px;position:relative}
.rev-s .t{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.rev-s b{display:block;font-family:var(--head);font-weight:400;font-size:19px;line-height:1.2}
.rev-s p{margin:6px 0 0;font-size:13.5px;color:var(--warm-gray)}
.rev-msg{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.bubble{background:#fff;border:1px solid var(--line-light);border-radius:20px;padding:18px}
.bubble .from{font-size:12px;font-weight:700;color:var(--warm-gray);margin-bottom:8px}
.bubble .txt{background:#E7F3EF;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.stars{display:flex;gap:6px;margin-top:10px}
.stars span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--porcelain);border:1px solid var(--line-light);font-size:13px;font-weight:800;color:var(--ink)}
.rev-rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rev-rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;color:var(--ink)}
.rev-rules svg{width:20px;height:20px;color:var(--teal);margin-top:1px}

/* plan timeline */
.tl{position:relative;max-width:820px;margin:0 auto;padding-left:60px}
.tl-line{position:absolute;left:21px;top:8px;bottom:8px;width:2px;background:var(--line-light);border-radius:2px}
.tl-line i{position:absolute;left:0;top:0;width:100%;height:0;background:var(--teal);border-radius:2px;transition:height .15s linear}
.tl-i{position:relative;padding:0 0 26px}
.tl-i .dot{position:absolute;left:-60px;top:0;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line-light);display:grid;place-items:center;font-weight:800;color:var(--warm-gray);transition:all .35s}
.tl-i.on .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.tl-c{background:#fff;border:1px solid var(--line-light);border-radius:18px;padding:18px 20px;opacity:.55;transform:translateX(8px);transition:opacity .4s,transform .4s,box-shadow .4s}
.tl-i.on .tl-c{opacity:1;transform:none;box-shadow:0 18px 36px -28px rgba(63,33,39,.5)}
.tl-c .tl-m{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta)}
.tl-c h3{font-size:22px;margin:4px 0 8px}
.tl-c ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px;color:var(--warm-gray)}

/* KPIs */
.kpi-feature{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.kf{position:relative;text-align:center;padding:22px;border:1px solid var(--line-dark);border-radius:var(--r);background:rgba(255,255,255,.04)}
.kf svg{width:130px;height:130px;transform:rotate(-90deg)}
.kf circle{fill:none;stroke-width:10}
.kf .trk{stroke:rgba(248,243,236,.15)}
.kf .bar{stroke:var(--champagne);stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.kf-c{position:absolute;left:0;right:0;top:66px;display:flex;justify-content:center;align-items:baseline;color:#F8F3EC}
.kf-c b{font-family:var(--head);font-weight:400;font-size:38px}
.kf-c span{font-size:16px;margin-left:2px}
.kf p{margin:10px 0 0;color:#F8F3EC;font-weight:600}
.kf small{display:block;font-weight:400;font-size:12px;color:rgba(248,243,236,.75)}
.kpi-tbl{background:#fff;color:var(--ink);border-radius:20px;padding:6px 18px;overflow-x:auto}
.kt-h,.kt-r{display:grid;grid-template-columns:1.1fr 1.6fr .8fr .8fr;gap:14px;align-items:start;padding:12px 0;min-width:680px}
.kt-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze);border-bottom:1px solid var(--line-light)}
.kt-r + .kt-r{border-top:1px solid var(--line-light)}
.kt-r b{font-family:var(--head);font-weight:400;font-size:17px}
.kt-r span{font-size:14px;color:var(--ink)}
.kt-r small{display:block;margin-top:3px;font-size:12px;color:var(--warm-gray)}
.kt-r .t{font-weight:700;color:var(--teal)}
.g-dark .kpi-tbl p{color:var(--warm-gray)}
.g-dark .fine{color:rgba(248,243,236,.75)}

/* tools */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tg{background:#fff;border:1px solid var(--line-light);border-radius:18px;padding:20px}
.tg h3{font-size:19px;margin:0 0 12px}
.chips-x{display:flex;flex-wrap:wrap;gap:6px}
.chips-x span{font-size:13px;padding:7px 12px;border-radius:999px;background:var(--porcelain);border:1px solid var(--line-light)}

/* results */
.g-res{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
.res-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.res-list li{background:#fff;border:1px solid var(--line-light);border-radius:16px;padding:14px 16px;font-size:15px}
.res-list b{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta);margin-bottom:4px}
.chart-box{background:#fff;border:1px solid var(--line-light);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.cb-h{display:flex;gap:18px;font-size:13px;font-weight:600;margin-bottom:6px}
.cb-h i{display:inline-block;width:18px;height:3px;border-radius:3px;margin-right:6px;vertical-align:middle}
.cb-h .l1{background:var(--teal)}.cb-h .l2{background:var(--burgundy)}
#res-chart{width:100%;height:auto}
#res-chart .grid line{stroke:var(--line-light);stroke-dasharray:3 4}
#res-chart text{font-size:11px;fill:var(--warm-gray);font-family:var(--ui)}
#res-chart .grid text{text-anchor:end}
#res-chart .xl text{text-anchor:middle}
#res-chart path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#res-chart .c1{stroke:var(--teal)}
#res-chart .c2{stroke:var(--burgundy);stroke-dasharray:0}

/* pricing */
.plans3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.pl{position:relative;background:#fff;border:1px solid var(--line-light);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:6px}
.pl.pop{border:2px solid var(--burgundy);box-shadow:0 30px 60px -36px rgba(113,60,71,.7);transform:translateY(-8px)}
.pl-b{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--burgundy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.pl h3{font-size:28px;margin:0}
.pl .for{margin:0;font-size:13.5px;color:var(--warm-gray)}
.price{display:flex;align-items:baseline;gap:4px;margin:14px 0 2px}
.price b{font-family:var(--head);font-weight:400;font-size:46px;line-height:1;color:var(--burgundy)}
.price span{color:var(--warm-gray)}
.price s{font-size:16px;color:var(--warm-gray);margin-left:6px}
.pl-off{display:inline-block;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:rgba(46,100,94,.12);color:var(--teal)}
.pl-tot{margin:0 0 12px;font-size:12.5px;color:var(--warm-gray)}
.pl .big{font-family:var(--head);font-size:30px;color:var(--burgundy);line-height:1;margin:10px 0 0}
.pl .big small{font-family:var(--ui);font-size:13px;color:var(--warm-gray);margin-left:6px}
.pl ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;font-size:14px}
.pl li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.pl li::before{content:"✓";color:var(--teal);font-weight:800}
.pl .btn{margin-top:auto;width:100%}
.cmp{margin-top:36px;background:#fff;border:1px solid var(--line-light);border-radius:20px;padding:8px 18px;overflow-x:auto}
.cmp-h,.cmp-r{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:10px;align-items:center;padding:10px 0;min-width:620px}
.cmp-h{font-family:var(--head);font-size:19px;border-bottom:1px solid var(--line-light)}
.cmp-h span,.cmp-r span:not(:first-child){text-align:center}
.cmp-cat{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);padding:16px 0 4px;min-width:620px}
.cmp-r{font-size:14px;border-top:1px solid var(--line-light)}
.cmp-r .y{color:var(--teal);font-weight:800}
.cmp-r .n{color:var(--line-dark)}

/* ROI */
.g-roi{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.roi{background:#fff;color:var(--ink);border-radius:24px;padding:24px;display:grid;gap:14px}
.roi label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.roi select{font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line-light);background:#fff;color:var(--ink)}
.roi input[type=range]{accent-color:var(--burgundy)}
.roi output{font-family:var(--head);font-size:20px;color:var(--burgundy)}
.roi-out{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:6px;border-top:1px solid var(--line-light)}
.roi-out div{background:var(--porcelain);border-radius:14px;padding:12px}
.roi-out span{display:block;font-size:11.5px;color:var(--warm-gray)}
.roi-out b{font-family:var(--head);font-weight:400;font-size:24px}
.roi-out .ok b{color:var(--teal)}
.roi-out .lo b{color:var(--terracotta)}
.roi-out p{grid-column:1/-1;margin:4px 0 0;font-size:15px;color:var(--ink)}
.roi .fine{color:var(--warm-gray);margin:0}

/* GEO intake questionnaire */
.qz{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:start}
.qz>*,.hx-grid>*,.g-m1>*,.g-res>*,.g-roi>*,.opp,.rev-msg>*{min-width:0}
.qz-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qz-steps button{appearance:none;border:1px solid var(--line-light);background:#fff;font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:999px;color:var(--warm-gray);cursor:pointer;display:flex;gap:6px;align-items:center}
.qz-steps button i{font-style:normal;font-size:11px;background:var(--porcelain);border-radius:999px;padding:1px 7px}
.qz-steps button.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.qz-steps button.on i{background:rgba(255,255,255,.18)}
.qz-card{background:#fff;border:1px solid var(--line-light);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.qz-q{padding:16px 0;border-top:1px solid var(--line-light)}
.qz-q:first-child{border-top:0;padding-top:0}
.qz-q h3{font-family:var(--ui);font-weight:700;font-size:15.5px;letter-spacing:0;margin:0 0 4px;color:var(--ink)}
.qz-q .hint{display:block;font-size:12.5px;color:var(--warm-gray);margin-bottom:10px}
.qz-q .multi{font-size:11px;font-weight:700;color:var(--bronze);margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{appearance:none;border:1px solid var(--line-light);background:var(--porcelain);font:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;color:var(--ink);transition:background .2s,border-color .2s}
.opts button:hover{border-color:var(--burgundy)}
.opts button.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.qz-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qz-in label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink)}
.qz-in input{font:inherit;font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid var(--line-light);background:#fff;color:var(--ink);outline:0;width:100%}
.qz-in input:focus{border-color:var(--burgundy);box-shadow:0 0 0 4px rgba(113,60,71,.12)}
.qz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.qz-side{position:sticky;top:96px;background:var(--burgundy);color:var(--porcelain);border-radius:24px;padding:22px}
.qz-side h3{font-size:24px;color:var(--porcelain);margin:0 0 4px}
.qz-side .sub{margin:0 0 14px;font-size:13.5px;color:rgba(248,243,236,.85)}
.qz-meter{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qz-meter i{flex:1;height:8px;border-radius:8px;background:rgba(248,243,236,.18);overflow:hidden}
.qz-meter i::after{content:"";display:block;height:100%;width:var(--w,0%);background:var(--champagne);border-radius:8px;transition:width .4s var(--ease)}
.qz-meter b{font-family:var(--head);font-weight:400;font-size:26px;color:var(--porcelain);min-width:56px;text-align:right}
.qz-list{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-height:420px;overflow:auto}
.qz-list li{background:rgba(255,255,255,.07);border:1px solid var(--line-dark);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:var(--porcelain)}
.qz-list li b{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--champagne);margin-bottom:2px}
.qz-list .empty{background:none;border-style:dashed;color:rgba(248,243,236,.8)}
.qz-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qz-acts .btn{padding:12px 10px;font-size:11px;letter-spacing:.08em;width:100%}
.qz-acts .btn-light{grid-column:1/-1}
.qz-acts .btn-ghost{background:transparent;color:var(--porcelain);border:1px solid rgba(248,243,236,.5)}
.qz-ok{min-height:1.2em;font-size:12.5px;color:var(--champagne);margin:8px 0 0}

/* compliance + cta */

  .rev{grid-template-columns:1fr 1fr}
  .rev-msg{grid-template-columns:1fr}
  .pillars4{grid-template-columns:1fr 1fr}
  .process{grid-template-columns:1fr;gap:16px}.process::before{display:none}

  .comp{grid-template-columns:1fr 1fr}
  .pl.pop{transform:none}
  .g-cta{grid-template-columns:1fr}
}

  .op-r{grid-template-columns:1fr auto;gap:6px}

}

    $('#qz-card').innerHTML = (g.inputs ? `<div class="qz-q"><div class="qz-in">${FIELDS.map(([k, l, t]) => `<label>${l}<input type="${t}" data-f="${k}" value="${esc(st.f[k] || '')}" autocomplete="${k === 'email' ? 'email' : k === 'nombre' ? 'name' : k === 'web' ? 'url' : 'organization'}"></label>`).join('')}</div></div>` : '') +
      g.qs.map((q) => `<div class="qz-q"><h3>${q.q}${q.multi ? `<span class="multi">${S('varias opciones', 'pick several')}</span>` : ''}</h3>${q.hint ? `<span class="hint">${q.hint}</span>` : ''}<div class="opts" data-q="${q.id}" role="group">${q.opts.map((op, i) => `<button type="button" data-o="${i}" class="${sel(q).includes(op.l) ? 'on' : ''}" aria-pressed="${sel(q).includes(op.l)}">${op.l}</button>`).join('')}</div></div>`).join('') +
      `<div class="qz-nav"><button type="button" class="btn btn-line" id="qz-prev" ${st.step === 0 ? 'disabled' : ''}>${S('Anterior', 'Back')}</button><button type="button" class="btn btn-gold" id="qz-next">${st.step === QZ.length - 1 ? S('Ver mi checklist', 'See my checklist') : S('Siguiente', 'Next')}</button></div>`;
  };
  const actions = () => ALLQ.flatMap((q) => {
    const s = sel(q); if (!s.length) return [];
    const list = q.fn ? q.fn(s, q.opts) : s.map((l) => (q.opts.find((op) => op.l === l) || {}).a).filter(Boolean);
    return list.map((t) => [q.q.replace(/[¿?]/g, ''), t]);
  });
  const renderSide = () => {
    const done = ALLQ.filter((q) => sel(q).length).length, pct = Math.round(done / ALLQ.length * 100);
    $('#qz-bar').style.setProperty('--w', pct + '%'); $('#qz-pct').textContent = pct + '%';
    const acts = actions();
    $('#qz-list').innerHTML = acts.length ? acts.map(([k, t]) => `<li><b>${esc(k)}</b>${esc(t)}</li>`).join('') : `<li class="empty">${S('Elige opciones y aquí aparecen los pasos y accesos que necesitamos.', 'Pick options and the steps and access we need appear here.')}</li>`;
  };
  const summary = () => {
    const L = [S('Cuestionario GEO · Clinic Management Tech', 'GEO questionnaire · Clinic Management Tech'), ''];
    FIELDS.concat([['plan', S('Plan elegido', 'Chosen plan')]]).forEach(([k, l]) => { if (st.f[k]) L.push(`${l}: ${st.f[k]}`); });
    QZ.forEach((g) => { L.push('', '— ' + g.g); g.qs.forEach((q) => L.push(`${q.q.replace(/[¿?]/g, '')}: ${sel(q).join(', ') || S('sin responder', 'not answered')}`)); });
    L.push('', S('Checklist de arranque', 'Kick-off checklist')); actions().forEach(([, t]) => L.push('• ' + t));
    return L.join('\n');
  };
  const refresh = () => { renderSteps(); renderSide(); save(); };
  renderSteps(); renderCard(); renderSide();
  $('#qz-steps').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; st.step = +b.dataset.s; renderCard(); refresh(); });
  $('#qz-card').addEventListener('click', (e) => {
    const b = e.target.closest('.opts button');
    if (b) {
      const q = ALLQ.find((x) => x.id === b.parentNode.dataset.q), l = q.opts[+b.dataset.o].l;
      let s = sel(q).slice();
      if (q.multi) s = s.includes(l) ? s.filter((x) => x !== l) : s.concat(l); else s = s[0] === l ? [] : [l];
      st.a[q.id] = s;
      $$('button', b.parentNode).forEach((x) => { const on = s.includes(q.opts[+x.dataset.o].l); x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      refresh(); return;
    }
    if (e.target.closest('#qz-prev')) { st.step = Math.max(0, st.step - 1); renderCard(); refresh(); $('#cuestionario').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); }
    if (e.target.closest('#qz-next')) {
      if (st.step < QZ.length - 1) { st.step++; renderCard(); refresh(); $('#cuestionario').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); }
      else $('.qz-side').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    }
  });
  $('#qz-card').addEventListener('input', (e) => { const f = e.target.dataset.f; if (f) { st.f[f] = e.target.value.trim(); save(); } });
  const ok = (t) => { $('#qz-ok').textContent = t; setTimeout(() => { $('#qz-ok').textContent = ''; }, 3500); };
  $('#qz-copy').addEventListener('click', () => {
    const txt = summary();
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(S('Copiado.', 'Copied.')); } catch (err) { ok(S('No se pudo copiar.', 'Could not copy.')); } ta.remove(); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => ok(S('Copiado.', 'Copied.')), fallback); else fallback();
  });
  $('#qz-mail').addEventListener('click', () => { location.href = `mailto:${CFG.EMAIL}?subject=${encodeURIComponent(S('Cuestionario GEO', 'GEO questionnaire') + (st.f.clinica ? ' · ' + st.f.clinica : ''))}&body=${encodeURIComponent(summary())}`; });
  $('#qz-wa').addEventListener('click', () => { window.open(`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(summary())}`, '_blank', 'noopener'); });
  // "I want this plan" stores the plan choice in the questionnaire summary
  $('#plans3').addEventListener('click', (e) => { const a = e.target.closest('[data-plan]'); if (!a) return; const p = PLANS.find((x) => x.id === a.dataset.plan); st.f.plan = `${p.n} · ${term === 12 ? S('12 meses (20% menos)', '12 months (20% off)') : S('mensual', 'monthly')}`; save(); });
})();
</script>
</body>
</html>
